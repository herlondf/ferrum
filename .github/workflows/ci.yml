name: CI

# Every push to main that passes the tests and builds becomes a release when
# the version in Cargo.toml has no tag yet: bump the version to publish
# (scripts/bump-version.sh). Same flow as github.com/herlondf/duck.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format and lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Configure git for tests
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main
      # Test repositories (and submodule clones) keep LF line endings.
      - run: git config --global core.autocrlf false
      - run: cargo test --workspace

  build:
    name: Build (${{ matrix.name }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported Ubuntu, so the binaries run on older glibc too.
          - { os: ubuntu-22.04, name: linux-x86_64 }
          - { os: windows-latest, name: windows-x86_64 }
          - { os: macos-latest, name: macos-universal }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2

      # The packaging scripts are the same ones a release workflow calls;
      # STRICT / -Strict makes a missing packaging tool an error.
      - name: Package (tar.gz, .deb, .rpm, AppImage)
        if: runner.os == 'Linux'
        run: |
          cargo build --release --locked -p ferrum
          cargo install --locked cargo-deb cargo-generate-rpm
          sudo curl -sSfL -o /usr/local/bin/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          sudo chmod +x /usr/local/bin/appimagetool
          STRICT=1 scripts/package-linux.sh
      - name: Package (zip, installer)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --release --locked -p ferrum
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          scripts/package-windows.ps1 -Strict
      - name: Package (universal .dmg and .zip)
        if: runner.os == 'macOS'
        run: scripts/package-macos.sh

      - uses: actions/upload-artifact@v4
        with:
          name: ferrum-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  # Checks the Linux metadata and makes the Flatpak's offline crate sources.
  flatpak-sources:
    name: Flatpak sources and metadata
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq appstream desktop-file-utils python3-aiohttp python3-tomlkit
      - run: desktop-file-validate packaging/linux/ferrum.desktop
      - run: appstreamcli validate --no-net --explain packaging/linux/io.github.herlondf.Ferrum.metainfo.xml
      - name: cargo-sources.json
        run: |
          curl -sSfL -o "$RUNNER_TEMP/flatpak-cargo-generator.py" \
            https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/master/cargo/flatpak-cargo-generator.py
          python3 "$RUNNER_TEMP/flatpak-cargo-generator.py" Cargo.lock -o packaging/flatpak/cargo-sources.json
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak-cargo-sources
          path: packaging/flatpak/cargo-sources.json

  flatpak:
    name: Flatpak
    needs: flatpak-sources
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-49
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: flatpak-cargo-sources
          path: packaging/flatpak
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: ferrum-linux-x86_64.flatpak
          manifest-path: packaging/flatpak/io.github.herlondf.Ferrum.yml
          cache-key: flatpak-builder-${{ hashFiles('Cargo.lock') }}

  # Is the version in Cargo.toml already released?
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      new: ${{ steps.v.outputs.new }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ -n "$v" ] || { echo "::error::no version in Cargo.toml"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then
            echo "::notice::v$v is already released. Bump the version (scripts/bump-version.sh) to publish a new one."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Release
    needs: [build, version]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.version.outputs.new == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: ferrum-*
          path: dist
          merge-multiple: true
      - name: Checksums and package manager manifests
        run: |
          scripts/checksums.sh dist
          python3 scripts/release-manifests.py "${{ needs.version.outputs.version }}" dist "$RUNNER_TEMP/manifests"
      # winget, Scoop, Homebrew and Flathub files, to submit by hand (docs/RELEASING.md).
      - uses: actions/upload-artifact@v4
        with:
          name: manifests
          path: ${{ runner.temp }}/manifests
      - name: Release notes
        run: |
          prev=$(git describe --tags --abbrev=0 2>/dev/null || true)
          raw="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main"
          {
            echo "## Instalar / Install"
            echo
            echo "Linux:"
            echo
            echo '```sh'
            echo "curl -fsSL $raw/get.sh | sh"
            echo '```'
            echo
            echo "Windows (PowerShell):"
            echo
            echo '```powershell'
            echo "irm $raw/get.ps1 | iex"
            echo '```'
            echo
            echo "Também / Also: AppImage, .deb, .rpm, instalador do Windows / Windows installer (\`-setup.exe\`), macOS (.dmg). Confira com / verify with \`SHA256SUMS\`."
            echo
            echo "## Mudanças / Changes"
            echo
            git log --no-merges --format='- %s' ${prev:+$prev..}HEAD
          } > notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="v${{ needs.version.outputs.version }}"
          gh release create "$v" dist/* --target "$GITHUB_SHA" --title "Ferrum $v" --notes-file notes.md
